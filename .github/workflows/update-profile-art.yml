name: Update profile art

# Runs every 3 hours (so a new profile picture shows up the same day), on demand, and on every push, so editing docs/profile.json on GitHub is
# all it takes. scripts/build.py checks the profile first; if anything is wrong the
# run fails with the reason in its log and NOTHING is committed, so the live profile
# keeps its last good version.

"on":
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours at :17
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/build.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "README.md *.svg buttons/*.svg hm/*.svg data/contributions.json docs/profile.live.json docs/spider.txt scripts/source-avatar.jpg"
